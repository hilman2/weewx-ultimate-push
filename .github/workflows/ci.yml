name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest
      - run: python -m pytest tests -q

  # Formatting is black's, with the project's single quotes kept. The settings are
  # in pyproject.toml, so this job and a developer's editor cannot disagree.
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install black
      - run: black --check --diff $(python tools/checked_paths.py black)

  # Two checkers, because the types live in two places. mypy reads the code; the
  # second reads the Google docstrings, which no command line checker looks at and
  # which are where this project, like WeeWX, declares its parameter types.
  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mypy weewx
      - run: mypy
      - name: Docstring types against the signatures
        run: |
          python tools/check_docstring_types.py \
            $(python tools/checked_paths.py docstrings)

  # The driver has to keep running on the Python versions WeeWX still supports,
  # which is older than anything the runners will install.
  compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install vermin
      # Which paths, and why the development tools are left out of them, is in
      # tools/checked_paths.py. Stated there rather than here, so that this job and
      # the container's `checks` service cannot come to check different things.
      - run: |
          vermin --target=3.7 --violations \
            $(python tools/checked_paths.py vermin)

  # With WeeWX installed, the tests can also check that the bundled listener is
  # still identical to the one in the core.
  with-weewx:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pytest weewx
      - run: python -m pytest tests -q
